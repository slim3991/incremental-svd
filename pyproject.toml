[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "incremental-svd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "pybind11>=3.0.4",
    "pytest>=9.0.3",
]

[tool.scikit-build]
# This tells CMake to put the .so file inside the isvd folder
cmake.build-type = "Release"
wheel.install-dir = "isvd" 
